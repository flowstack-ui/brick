name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Bounded diagnostics only; none runs ordinary CI
        type: choice
        options: [none, release-blockers]
        default: none
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.diagnostic || 'none' }}
  cancel-in-progress: true

jobs:
  release-diagnostic-build:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'release-blockers'
    name: diagnostic exact build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and pack this candidate once
        run: |
          npm run build:playground
          mkdir -p test-results/diagnostic-build/archive
          npm pack --pack-destination test-results/diagnostic-build/archive
          node scripts/verify-release-diagnostic-archive.mjs test-results/diagnostic-build/archive --record
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-diagnostic-package
          path: test-results/diagnostic-build/archive/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-diagnostic-playground
          path: playground/dist/
          if-no-files-found: error
          retention-days: 14

  release-blocker-diagnostics:
    needs: release-diagnostic-build
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'release-blockers'
    name: diagnostic (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: avatar-mobile-webkit
            engine: webkit
          - case: toast-mobile-webkit
            engine: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-diagnostic-package
          path: test-results/release-blockers/${{ matrix.case }}/archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-diagnostic-playground
          path: playground/dist
      - name: Verify and restore the exact candidate build
        env:
          DIAGNOSTIC_CASE: ${{ matrix.case }}
        run: |
          node scripts/verify-release-diagnostic-archive.mjs "test-results/release-blockers/$DIAGNOSTIC_CASE/archive"
          tar -xzf "test-results/release-blockers/$DIAGNOSTIC_CASE/archive/flowstack-ui-brick-0.3.0.tgz" --strip-components=1 package/dist
      - name: Install the one diagnostic browser engine
        shell: bash
        timeout-minutes: 8
        env:
          DIAGNOSTIC_CASE: ${{ matrix.case }}
        run: npx playwright install --with-deps ${{ matrix.engine }} 2>&1 | tee "test-results/release-blockers/$DIAGNOSTIC_CASE/browser-install.log"
      - name: Run one unchanged blocker assertion with retained diagnostics
        timeout-minutes: 4
        env:
          DIAGNOSTIC_CASE: ${{ matrix.case }}
        run: node scripts/run-release-blocker-diagnostic.mjs "$DIAGNOSTIC_CASE"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-release-diagnostic-${{ matrix.case }}
          path: test-results/release-blockers/
          if-no-files-found: error
          retention-days: 14

  package:
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic != 'release-blockers'
    name: repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: git diff --check
      - run: npm run check:repository
      - run: npm run size:css
      - name: Create package archive
        run: |
          mkdir -p "$RUNNER_TEMP/brick-package"
          npm pack --pack-destination "$RUNNER_TEMP/brick-package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-package
          path: ${{ runner.temp }}/brick-package/*.tgz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-playground
          path: playground/dist/
          if-no-files-found: error
          retention-days: 3
      - run: git diff --exit-code

  browser-pull-request-shards:
    name: browser (chromium, group ${{ matrix.group }}/6)
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    needs: package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-playground
          path: playground/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-package
          path: ${{ runner.temp }}/brick-package
      - name: Extract exact packed build for browser discovery
        run: tar -xzf "$RUNNER_TEMP"/brick-package/*.tgz --strip-components=1 package/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:release:project:built -- chromium
        env:
          FLOWSTACK_RELEASE_SHARD_GROUP: ${{ matrix.group }}/6
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-playwright-chromium-${{ matrix.group }}-of-6
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-pull-request:
    name: browser (chromium)
    needs: browser-pull-request-shards
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require every Chromium group
        env:
          GROUP_RESULT: ${{ needs.browser-pull-request-shards.result }}
        run: test "$GROUP_RESULT" = success

  browser-main:
    name: browser (${{ matrix.project }}, group ${{ matrix.group }}/6)
    needs: package
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.diagnostic != 'release-blockers')
    runs-on: ubuntu-latest
    # Separate machines bound wall time without competing for one host.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, mobile-chromium, webkit, mobile-webkit]
        group: [1, 2, 3, 4, 5, 6]
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: mobile-chromium
            engine: chromium
          - project: webkit
            engine: webkit
          - project: mobile-webkit
            engine: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-playground
          path: playground/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-package
          path: ${{ runner.temp }}/brick-package
      - name: Extract exact packed build for browser discovery
        run: tar -xzf "$RUNNER_TEMP"/brick-package/*.tgz --strip-components=1 package/dist
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser:release:project:built -- ${{ matrix.project }}
        env:
          FLOWSTACK_RELEASE_SHARD_GROUP: ${{ matrix.group }}/6
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-playwright-${{ matrix.project }}-${{ matrix.group }}-of-6
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  archive-consumers:
    name: exact archive consumers
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-package
          path: ${{ runner.temp }}/brick-package
      - run: npm run pack:check:archive -- "$RUNNER_TEMP"/brick-package/*.tgz
      - run: npm run verify:consumers:archive -- "$RUNNER_TEMP"/brick-package/*.tgz
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:consumer:archive -- "$RUNNER_TEMP"/brick-package/*.tgz

  surface-effects:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-package
          path: ${{ runner.temp }}/brick-package
      - name: Extract exact packed build
        run: tar -xzf "$RUNNER_TEMP"/brick-package/*.tgz --strip-components=1 package/dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:surface-effects
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-surface-effects
          path: test-results/surface-effects/
          if-no-files-found: error
          retention-days: 14
