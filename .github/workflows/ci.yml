name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: git diff --check
      - run: npm run check:repository
      - run: npm run size:css
      - name: Create package archive
        run: |
          mkdir -p "$RUNNER_TEMP/brick-package"
          npm pack --pack-destination "$RUNNER_TEMP/brick-package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-package
          path: ${{ runner.temp }}/brick-package/*.tgz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-playground
          path: playground/dist/
          if-no-files-found: error
          retention-days: 3
      - run: git diff --exit-code

  browser-pull-request:
    name: browser (chromium)
    needs: package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-playground
          path: playground/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:project:built -- chromium
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-playwright-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-main:
    name: browser (${{ matrix.project }})
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
          - project: mobile-chromium
            engine: chromium
          - project: mobile-webkit
            engine: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-playground
          path: playground/dist
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser:release:project:built -- ${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  archive-consumers:
    name: exact archive consumers
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-package
          path: ${{ runner.temp }}/brick-package
      - run: npm run pack:check:archive -- "$RUNNER_TEMP"/brick-package/*.tgz
      - run: npm run verify:consumers:archive -- "$RUNNER_TEMP"/brick-package/*.tgz
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:consumer:archive -- "$RUNNER_TEMP"/brick-package/*.tgz
