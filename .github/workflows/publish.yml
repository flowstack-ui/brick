name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      already-published: ${{ steps.release-state.outputs.already-published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: release-state
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.version)')"
          repository_url="$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.repository.url)')"
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$repository_url" = "git+https://github.com/flowstack-ui/brick.git"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if npm view "@flowstack-ui/brick@$package_version" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

  repository:
    needs: validate
    if: needs.validate.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm run size:css
      - run: |
          mkdir -p "$RUNNER_TEMP/brick-package"
          npm pack --pack-destination "$RUNNER_TEMP/brick-package"
          npm run pack:check:archive -- "$RUNNER_TEMP"/brick-package/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package/*.tgz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-release-playground
          path: playground/dist/
          if-no-files-found: error
          retention-days: 3

  browser:
    name: browser (${{ matrix.project }}, group ${{ matrix.group }}/8)
    needs: repository
    runs-on: ubuntu-latest
    # Separate machines bound wall time without competing for one host.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, mobile-chromium, webkit, mobile-webkit]
        group: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: mobile-chromium
            engine: chromium
          - project: webkit
            engine: webkit
          - project: mobile-webkit
            engine: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-playground
          path: playground/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package
      - name: Extract exact packed build for browser discovery
        run: tar -xzf "$RUNNER_TEMP"/brick-package/*.tgz --strip-components=1 package/dist
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser:release:project:built -- ${{ matrix.project }}
        env:
          FLOWSTACK_RELEASE_SHARD_GROUP: ${{ matrix.group }}/8
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-release-browser-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  package-consumers:
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package
      - run: npm run verify:consumers:archive -- "$RUNNER_TEMP"/brick-package/*.tgz

  app-consumer:
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:consumer:archive -- "$RUNNER_TEMP"/brick-package/*.tgz

  publish:
    needs: [validate, repository, browser, package-consumers, app-consumer, surface-effects]
    if: needs.validate.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package
      - name: Publish verified archive
        run: npm publish "$RUNNER_TEMP"/brick-package/*.tgz --access public --provenance

  release:
    needs: [validate, publish]
    if: always() && (needs.validate.outputs.already-published == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  surface-effects:
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package
      - name: Extract exact packed build
        run: tar -xzf "$RUNNER_TEMP"/brick-package/*.tgz --strip-components=1 package/dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:surface-effects
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-surface-effects
          path: test-results/surface-effects/
          if-no-files-found: error
          retention-days: 14
