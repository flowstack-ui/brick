name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      already-published: ${{ steps.release-state.outputs.already-published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: release-state
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.version)')"
          repository_url="$(node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; process.stdout.write(pkg.repository.url)')"
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$repository_url" = "git+https://github.com/flowstack-ui/brick.git"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if npm view "@flowstack-ui/brick@$package_version" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

  repository:
    needs: validate
    if: needs.validate.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm run size:css
      - run: |
          mkdir -p "$RUNNER_TEMP/brick-package"
          npm pack --pack-destination "$RUNNER_TEMP/brick-package"
          npm run pack:check:archive -- "$RUNNER_TEMP"/brick-package/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package/*.tgz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brick-release-playground
          path: playground/dist/
          if-no-files-found: error
          retention-days: 3

  browser:
    name: browser (${{ matrix.label }})
    needs: repository
    runs-on: ubuntu-latest
    # WebKit keeps its 12 one-worker browser restarts, distributed across three
    # independent job groups so a release retry can target only the failed
    # group while the other exact-tag evidence remains green.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
            label: chromium
            shard_group: ""
          - project: firefox
            engine: firefox
            label: firefox
            shard_group: ""
          - project: mobile-chromium
            engine: chromium
            label: mobile-chromium
            shard_group: ""
          - project: webkit
            engine: webkit
            label: webkit, group 1/3
            shard_group: 1/3
          - project: webkit
            engine: webkit
            label: webkit, group 2/3
            shard_group: 2/3
          - project: webkit
            engine: webkit
            label: webkit, group 3/3
            shard_group: 3/3
          - project: mobile-webkit
            engine: webkit
            label: mobile-webkit, group 1/3
            shard_group: 1/3
          - project: mobile-webkit
            engine: webkit
            label: mobile-webkit, group 2/3
            shard_group: 2/3
          - project: mobile-webkit
            engine: webkit
            label: mobile-webkit, group 3/3
            shard_group: 3/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-playground
          path: playground/dist
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser:release:project:built -- ${{ matrix.project }}
        env:
          FLOWSTACK_RELEASE_SHARD_GROUP: ${{ matrix.shard_group }}

  package-consumers:
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package
      - run: npm run verify:consumers:archive -- "$RUNNER_TEMP"/brick-package/*.tgz

  app-consumer:
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:consumer:archive -- "$RUNNER_TEMP"/brick-package/*.tgz

  publish:
    needs: [validate, repository, browser, package-consumers, app-consumer]
    if: needs.validate.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brick-release-package
          path: ${{ runner.temp }}/brick-package
      - name: Publish verified archive
        run: npm publish "$RUNNER_TEMP"/brick-package/*.tgz --access public --provenance

  release:
    needs: [validate, publish]
    if: always() && (needs.validate.outputs.already-published == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
